<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 모드 · 상록T의 도구 모음</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="admin">
  <header class="top">
    <div>
      <h1>관리자 모드</h1>
      <p class="sub">링크와 그룹을 끌어서 순서를 바꿀 수 있어요</p>
    </div>
    <div class="actions">
      <a class="btn" href="index.html">사이트로</a>
      <button id="logoutBtn" class="btn" hidden>로그아웃</button>
    </div>
  </header>

  <!-- 인증 -->
  <section id="gate" class="gate" hidden>
    <form id="gateForm" class="panel" novalidate>
      <h2>인증 코드 입력</h2>
      <p class="hint">관리하려면 인증 코드가 필요해요.</p>
      <span class="inline">
        <input id="gateToken" type="password" placeholder="인증 코드" autocomplete="off">
        <button type="submit" class="btn primary" id="gateBtn">확인</button>
      </span>
      <p id="gateMsg" class="msg"></p>
    </form>
  </section>

  <!-- 관리 화면 -->
  <div id="app" hidden>
    <div class="editbar">
      <div class="actions">
        <button id="addLinkBtn" class="btn primary">+ 링크 추가</button>
        <button id="addGroupBtn" class="btn">+ 그룹 추가</button>
      </div>
      <div class="actions">
        <span id="selCount" class="selcount">0개 선택</span>
        <button id="selAllBtn" class="btn">전체 선택</button>
        <button id="delBtn" class="btn danger" disabled>선택 삭제</button>
      </div>
    </div>
    <main>
      <div id="board" class="board"></div>
      <p id="status" class="empty" hidden></p>
    </main>
  </div>

  <!-- 순서·그룹 변경 저장 바 -->
  <div id="saveBar" class="savebar" hidden>
    <span>저장하지 않은 변경사항이 있어요</span>
    <div class="actions">
      <button id="revertBtn" class="btn">되돌리기</button>
      <button id="saveBtn" class="btn primary">변경사항 저장</button>
    </div>
  </div>

  <!-- 링크 추가 / 수정 -->
  <dialog id="dlg">
    <form id="itemForm" class="panel" novalidate>
      <h2 id="formTitle">링크 추가</h2>
      <fieldset id="fields">
        <label>사이트 제목 <input name="title"></label>
        <label>설명 <textarea name="description" rows="3"></textarea></label>
        <label>링크 URL <input name="url" placeholder="https://"></label>
        <label>썸네일 이미지 URL <input name="thumbnail" placeholder="이미지 주소 (비우면 기본 배경)"></label>
        <label>그룹 <select name="group" id="groupSel"></select></label>
      </fieldset>
      <p id="addMsg" class="msg"></p>
      <div class="row">
        <button type="button" class="btn" id="cancelBtn">취소</button>
        <button type="submit" class="btn primary" id="saveItemBtn">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 그룹 이름 입력 -->
  <dialog id="pdlg">
    <form id="pForm" class="panel" novalidate>
      <h2 id="pTitle">그룹 추가</h2>
      <label>그룹 이름 <input id="pInput" maxlength="30" autocomplete="off"></label>
      <p id="pMsg" class="msg"></p>
      <div class="row">
        <button type="button" class="btn" id="pCancel">취소</button>
        <button type="submit" class="btn primary" id="pOk">확인</button>
      </div>
    </form>
  </dialog>

  <!-- 확인 / 알림 -->
  <dialog id="mdlg">
    <div class="panel">
      <h2 id="mTitle"></h2>
      <p id="mMsg" class="hint"></p>
      <div class="row">
        <button type="button" class="btn" id="mCancel">취소</button>
        <button type="button" class="btn primary" id="mOk">확인</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="config.js?v=3"></script>
  <script src="admin.js?v=3"></script>
</body>
</html>
